# config.yaml — everything that differs between YOUR bench and someone else's.
# Tests read this file; they never hardcode serial numbers or paths.

# How to launch Simplicity Commander.
#   In the lab  : "commander"          (after adding it to PATH)
#   On the bus  : "python3 tools/fake_commander.py"   (pretend board)
commander: "python3 tools/fake_commander.py"

boards:
  dut:
    serial: "440123456"        # <- replace with the J-Link serial on your kit
  peer:
    serial: "440654321"        # <- second board, used from Level 2 onwards

# Firmware images the tests flash.  Build these in Simplicity Studio / VS Code,
# convert them to RPS (`commander rps create`) and copy the .rps here.
# SiWx917 bootloaders only accept RPS images; .s37/.hex are not flashable.
# Names matter for the FAKE commander only.
firmware:
  ps4_active: firmware/ps4_active.rps     # PS4 active state, CPU running
  ps1_sleep:  firmware/ps1_sleep.rps      # PS1 ULP sleep, CPU off, RAM retained
  ble_adv:    firmware/ble_adv_1000ms.rps # BLE 5.4 advertising at 1 s

# Power test settings
power:
  settle_s: 2          # wait after reset before measuring (caps charge, radio calibrates)
  duration_s: 2        # how long each dump runs
  datarate_hz: 1000    # samples per second from AEM
  repeats: 5           # how many independent runs -> gives you mean AND std
  limits_mA:           # PASS if mean current is BELOW this. Start loose, tighten
    ps4_active: 5.0    #   once you have real numbers + datasheet in hand.
    ps1_sleep:  0.010
    ble_adv:    0.100

  # What the METER can actually resolve, per mode, in mA.  Not a preference --
  # this is the AEM's own spec from UG573 (BRD4002A / Si-MB4002A mainboard):
  #   range 0.1 uA .. 495 mA
  #   below 250 uA  -> accuracy 1 uA     = 0.001 mA
  #   above 250 uA  -> accuracy 0.1 mA   = 0.100 mA
  # A verdict never claims a tighter uncertainty than this, so five runs that
  # happen to agree to six decimals cannot buy a confident PASS the instrument
  # never earned.  Using an external meter (e.g. PPK2)? Put ITS floor here.
  instrument_floor_mA:
    ps4_active: 0.100  # ~2.6 mA  -> above 250 uA band
    ps1_sleep:  0.001  # ~1.8 uA  -> below 250 uA band
    ble_adv:    0.001  # ~45 uA   -> below 250 uA band
